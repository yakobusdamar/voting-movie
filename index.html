    <script>
      (function () {
        var base = "/";
        var m = location.search.match(/^\?path=(.*)$/);
        if (m) {
          var decoded = decodeURIComponent(m[1]);
          var trailing = location.search.substring(("?path=" + m[1]).length);
          history.replaceState(null, "", base + decoded + trailing + location.hash);
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
